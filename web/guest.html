<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guest Portal - EaseInn</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; min-height: 100vh; background: linear-gradient(135deg, #1B5E20, #4CAF50); display: flex; align-items: center; justify-content: center; }
    .container { background: white; border-radius: 16px; padding: 40px; width: 100%; max-width: 520px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    h1 { text-align: center; color: #1B5E20; margin-bottom: 4px; font-size: 28px; }
    .subtitle { text-align: center; color: #757575; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #555; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #1B5E20; box-shadow: 0 0 0 3px rgba(27,94,32,0.1); }
    .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #1B5E20; color: white; width: 100%; }
    .btn-primary:hover { background: #0D3B12; }
    .btn-outline { background: transparent; border: 1px solid #ddd; color: #333; }
    .btn-outline:hover { background: #f5f5f5; }
    .card { background: #f9f9f9; border-radius: 12px; padding: 20px; margin-top: 16px; }
    .card h3 { color: #1B5E20; margin-bottom: 12px; }
    .card p { margin-bottom: 6px; font-size: 14px; }
    .card .label { font-weight: 600; color: #555; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-success { background: #E8F5E9; color: #2E7D32; }
    .badge-warning { background: #FFF3E0; color: #E65100; }
    .badge-info { background: #E3F2FD; color: #1565C0; }
    .badge-danger { background: #FFEBEE; color: #C62828; }
    .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
    .alert-error { background: #FFEBEE; color: #C62828; }
    .alert-success { background: #E8F5E9; color: #2E7D32; }
    .hidden { display: none; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { padding: 8px 16px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-size: 14px; background: white; }
    .tab.active { background: #1B5E20; color: white; border-color: #1B5E20; }
  </style>
</head>
<body>
  <div class="container">
    <h1>EaseInn</h1>
    <p class="subtitle">Guest Self-Service Portal</p>

    <div id="lookupSection">
      <div class="tabs">
        <div class="tab active" onclick="showTab('lookup')">Find Booking</div>
        <div class="tab" onclick="showTab('feedback')">Leave Feedback</div>
      </div>

      <div id="lookupTab">
        <div id="lookupError" class="alert alert-error"></div>
        <div class="form-group">
          <label>Booking Reference or Email</label>
          <input type="text" id="lookupValue" placeholder="Enter booking ID or guest email">
        </div>
        <button class="btn btn-primary" onclick="lookupBooking()">Find Booking</button>
      </div>

      <div id="feedbackTab" class="hidden">
        <div id="feedbackError" class="alert alert-error"></div>
        <div id="feedbackSuccess" class="alert alert-success"></div>
        <div class="form-group">
          <label>Booking ID</label>
          <input type="text" id="fbBookingId" placeholder="Enter your booking ID">
        </div>
        <div class="form-group">
          <label>Rating</label>
          <select id="fbRating">
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Very Good</option>
            <option value="3">3 - Good</option>
            <option value="2">2 - Fair</option>
            <option value="1">1 - Poor</option>
          </select>
        </div>
        <div class="form-group">
          <label>Your Feedback</label>
          <textarea id="fbComment" rows="4" placeholder="Tell us about your stay..."></textarea>
        </div>
        <button class="btn btn-primary" onclick="submitFeedback()">Submit Feedback</button>
      </div>
    </div>

    <div id="bookingSection" class="hidden">
      <div class="tabs">
        <div class="tab active" onclick="showSection('booking')">Booking Details</div>
        <div class="tab" onclick="showTab('feedback')">Leave Feedback</div>
      </div>
      <div id="bookingInfo"></div>
      <div style="margin-top: 16px">
        <button class="btn btn-outline" onclick="resetForm()" style="width: 100%">Look Up Another Booking</button>
      </div>
    </div>
  </div>

  <script>
    const API = '/api/v1';

    function $(sel) { return document.querySelector(sel); }
    function show(el) { $(el).style.display = ''; }
    function hide(el) { $(el).style.display = 'none'; }

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      if (tab === 'lookup') {
        show('#lookupTab'); hide('#feedbackTab');
        document.querySelectorAll('.tab')[0].classList.add('active');
      } else {
        hide('#lookupTab'); show('#feedbackTab');
        document.querySelectorAll('.tab')[1].classList.add('active');
      }
    }

    function showSection(section) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab')[0].classList.add('active');
    }

    function resetForm() {
      hide('#bookingSection'); show('#lookupSection');
      $('#lookupValue').value = '';
    }

    async function lookupBooking() {
      const val = $('#lookupValue').value.trim();
      hide('#lookupError');
      if (!val) { showErr('#lookupError', 'Please enter a booking reference or email'); return; }
      try {
        const res = await fetch(`${API}/guest/booking?ref=${encodeURIComponent(val)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        const b = data.data.booking;
        const room = b.room || {};
        const checkIn = new Date(b.checkIn).toLocaleDateString();
        const checkOut = new Date(b.checkOut).toLocaleDateString();
        const amount = (b.pricing?.totalAmount || 0).toLocaleString();
        const paid = (b.amountPaid || 0).toLocaleString();

        $('#bookingInfo').innerHTML = `
          <div class="card">
            <h3>Booking Confirmed</h3>
            <p><span class="label">Guest:</span> ${b.guest?.name || '-'}</p>
            <p><span class="label">Email:</span> ${b.guest?.email || '-'}</p>
            <p><span class="label">Room:</span> ${room.roomNumber || '-'} (${room.roomType || '-'})</p>
            <p><span class="label">Check-in:</span> ${checkIn}</p>
            <p><span class="label">Check-out:</span> ${checkOut}</p>
            <p><span class="label">Guests:</span> ${b.numberOfGuests || 1}</p>
            <p><span class="label">Status:</span> <span class="badge badge-${b.bookingStatus === 'checked-in' ? 'success' : b.bookingStatus === 'confirmed' ? 'info' : 'warning'}">${b.bookingStatus}</span></p>
            <p><span class="label">Total:</span> LKR ${amount}</p>
            <p><span class="label">Paid:</span> LKR ${paid} <span class="badge badge-${b.paymentStatus === 'paid' ? 'success' : 'warning'}">${b.paymentStatus}</span></p>
            ${b.specialRequests ? `<p><span class="label">Special Requests:</span> ${b.specialRequests}</p>` : ''}
          </div>`;
        hide('#lookupSection'); show('#bookingSection');
      } catch (err) { showErr('#lookupError', err.message); }
    }

    async function submitFeedback() {
      const bookingId = $('#fbBookingId').value.trim();
      hide('#feedbackError'); hide('#feedbackSuccess');
      if (!bookingId) { showErr('#feedbackError', 'Booking ID is required'); return; }
      try {
        const res = await fetch(`${API}/feedback`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            booking: bookingId,
            rating: parseInt($('#fbRating').value),
            comment: $('#fbComment').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message);
        showSuccess('#feedbackSuccess', 'Thank you for your feedback!');
        $('#fbBookingId').value = '';
        $('#fbComment').value = '';
      } catch (err) { showErr('#feedbackError', err.message); }
    }

    function showErr(sel, msg) { const el = $(sel); el.textContent = msg; el.style.display = 'block'; }
    function showSuccess(sel, msg) { const el = $(sel); el.textContent = msg; el.style.display = 'block'; }
  </script>
</body>
</html>
