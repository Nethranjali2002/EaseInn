services:
  app:
    build:
      context: .
      target: development
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./src:/app/src
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
